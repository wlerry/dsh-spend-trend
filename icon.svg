    <circle cx="8" cy="8" r="223" fill="url(#violetA)"/>
    <circle cx="376" cy="376" r="238" fill="url(#violetB)"/>
    <circle cx="13" cy="13" r="115" fill="url(#glintA)"/>
    <circle cx="371" cy="371" r="123" fill="url(#glintB)"/>

    <use href="#curve" fill="none" stroke="#78A0FF" stroke-width="31" stroke-linecap="round" opacity="0.55" filter="url(#waveGlow)"/>
    <use href="#curve" fill="none" stroke="url(#wave)" stroke-width="20.7" stroke-linecap="round"/>

    <circle cx="115.2" cy="103.7" r="46" fill="#FF6B6B" opacity="0.55" filter="url(#dotGlow)"/>
