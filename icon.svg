<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384" role="img" aria-label="DeepSeek spend trend">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2446D8"/>
      <stop offset="1" stop-color="#1136AA"/>
    </linearGradient>
    <radialGradient id="violetA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5C38D2" stop-opacity="0.72"/>
      <stop offset="0.55" stop-color="#5C38D2" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5C38D2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4C34E0" stop-opacity="0.72"/>
      <stop offset="0.55" stop-color="#4C34E0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4C34E0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glintA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8052FF" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#8052FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8052FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glintB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7448FF" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#7448FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7448FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="23" y1="0" x2="365" y2="0">
      <stop offset="0" stop-color="#FFA0B4"/>
      <stop offset="0.30" stop-color="#F6F8FF"/>
      <stop offset="0.58" stop-color="#9DF0C0"/>
      <stop offset="0.78" stop-color="#DFF9EA"/>
      <stop offset="1" stop-color="#F6F8FF"/>
    </linearGradient>
    <radialGradient id="peakFill" cx="0.38" cy="0.32" r="0.75">
